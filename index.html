<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Classic Minesweeper, built with React. Installable and playable offline." />
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MineSweeper</title>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme, and
      // kept in sync if the OS theme changes while the tab is open. No
      // manual toggle yet (not asked for) -- this just makes the dark:
      // variants added in Phase 6 follow the OS/browser preference.
      var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
      var syncTheme = function (matches) {
        document.documentElement.classList.toggle('dark', matches);
      };
      syncTheme(darkQuery.matches);
      darkQuery.addEventListener('change', function (e) {
        syncTheme(e.matches);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
